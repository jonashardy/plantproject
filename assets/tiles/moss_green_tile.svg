<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <title>Moss Green Tile (Seamless)</title>
  <!-- Base moss green -->
  <rect width="64" height="64" fill="#8A9A5B"/>

  <!-- Soft mottled texture: darker flecks -->
  <g fill="#6F7F43" opacity="0.35">
    <circle cx="10" cy="8" r="1.6"/>
    <circle cx="22" cy="14" r="1.2"/>
    <circle cx="38" cy="10" r="1.4"/>
    <circle cx="54" cy="12" r="1.3"/>
    <circle cx="14" cy="28" r="1.5"/>
    <circle cx="30" cy="24" r="1.1"/>
    <circle cx="46" cy="26" r="1.7"/>
    <circle cx="8" cy="46" r="1.4"/>
    <circle cx="24" cy="50" r="1.3"/>
    <circle cx="40" cy="44" r="1.2"/>
    <circle cx="56" cy="52" r="1.5"/>
  </g>

  <!-- Soft mottled texture: lighter flecks -->
  <g fill="#A5B777" opacity="0.35">
    <circle cx="6" cy="20" r="1.2"/>
    <circle cx="18" cy="6" r="1.0"/>
    <circle cx="28" cy="36" r="1.3"/>
    <circle cx="36" cy="20" r="1.1"/>
    <circle cx="50" cy="30" r="1.2"/>
    <circle cx="14" cy="58" r="1.1"/>
    <circle cx="32" cy="56" r="1.4"/>
    <circle cx="46" cy="58" r="1.0"/>
  </g>

  <!-- Gentle organic streaks (subtle) -->
  <g fill="#7E8F4D" opacity="0.20">
    <path d="M4,34 C10,30 18,32 24,28 C30,24 38,26 44,22 C50,18 58,20 60,18 L60,22 C54,24 48,22 42,26 C36,30 28,28 22,32 C16,36 10,36 4,38 Z"/>
    <path d="M2,12 C8,10 14,12 20,10 C26,8 34,10 40,8 C46,6 54,8 62,6 L62,8 C54,10 46,8 40,10 C34,12 26,10 20,12 C14,14 8,14 2,16 Z"/>
  </g>

  <!-- Note: shapes do not touch edges to ensure seamless tiling. -->
</svg>

